name: Release & CI Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os: 'linux'
          - platform: 'windows-latest'
            os: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js (for Tauri bundler)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux System Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Terminal CLI Tool
        run: cargo build --release

      - name: Build Desktop Application & Installer
        run: |
          npm install -g @tauri-apps/cli
          npx tauri build --manifest-path src-tauri/Cargo.toml || cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage Windows Executables & Installer
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          # Terminal CLI
          if [ -f target/release/linecounter.exe ]; then
            cp target/release/linecounter.exe dist/LineCounter-CLI-Windows.exe
          fi
          # Desktop Portable Executable
          if [ -f src-tauri/target/release/linecounter.exe ]; then
            cp src-tauri/target/release/linecounter.exe dist/LineCounter-Windows-Portable.exe
          fi
          # Desktop NSIS Setup Installer
          NSIS_INSTALLER=$(find src-tauri/target/release/bundle/nsis -name "*.exe" 2>/dev/null | head -n 1)
          if [ -n "$NSIS_INSTALLER" ] && [ -f "$NSIS_INSTALLER" ]; then
            cp "$NSIS_INSTALLER" dist/LineCounter-Setup-x64.exe
          fi
          # Desktop MSI Installer
          MSI_INSTALLER=$(find src-tauri/target/release/bundle/msi -name "*.msi" 2>/dev/null | head -n 1)
          if [ -n "$MSI_INSTALLER" ] && [ -f "$MSI_INSTALLER" ]; then
            cp "$MSI_INSTALLER" dist/LineCounter-Setup-x64.msi
          fi

      - name: Stage Linux Executables & Packages
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          # Terminal CLI
          if [ -f target/release/linecounter ]; then
            cp target/release/linecounter dist/LineCounter-CLI-Linux
            chmod +x dist/LineCounter-CLI-Linux
          fi
          # Desktop Executable
          if [ -f src-tauri/target/release/linecounter ]; then
            cp src-tauri/target/release/linecounter dist/LineCounter-Linux
            chmod +x dist/LineCounter-Linux
          fi
          # Debian Package
          DEB_PKG=$(find src-tauri/target/release/bundle/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_PKG" ] && [ -f "$DEB_PKG" ]; then
            cp "$DEB_PKG" dist/LineCounter-Linux.deb
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LineCounter-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
