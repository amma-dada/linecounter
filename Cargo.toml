[package]
name = "linecounter"
version = "1.0.0"
edition = "2021"
description = "LineCounter - Ultra-Fast SIMD Code and Line Counter in Pure Rust"
authors = ["Mortada (Dada)"]
license = "Apache-2.0"

[dependencies]
rayon = "1.10"
memchr = "2.7"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
